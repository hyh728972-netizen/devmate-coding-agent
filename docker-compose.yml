services:

  mcp:
    build: .
    command: python -m devmate.mcp.server
    environment:
      DEVMATE_MCP_HOST: "0.0.0.0"
      DEVMATE_MCP_PORT: "8001"
    ports:
      - "8001:8001"
    volumes:
      - ./config.toml:/app/config.toml

  agent:
    build: .
    command: python main.py
    depends_on:
      - mcp
    environment:
      DEVMATE_MCP_SERVER_URL: "http://mcp:8001/mcp"
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
      - ./config.toml:/app/config.toml
    stdin_open: true
    tty: true