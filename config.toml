# DevMate 配置文件

[model]
model_provider = "openai"
ai_base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key = ""
model_name = "glm-4.6"
embedding_model_name = "embedding-3"

[search]
tavily_api_key = ""

[langsmith]
langchain_tracing_v2 = true
langchain_api_key = ""
project = "devmate-agent"

[skills]
skills_dir = ".skills"
persist_dir = "data/skills"

[workspace]
root = "workspace"
auto_create = true

[mcp]
server_url = "http://127.0.0.1:8001/mcp"
host = "0.0.0.0"
port = 8001
path = "/mcp"

[agent]
max_steps = 15
planning_temperature = 0.2

[rag]
docs_dir = "docs"
persist_dir = "data/chroma"
